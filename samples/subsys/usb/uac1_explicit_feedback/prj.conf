CONFIG_I2S=y

# USB (device_next) configs
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_AUDIO1_CLASS=y
CONFIG_SAMPLE_USBD_PID=0x0012
CONFIG_SAMPLE_USBD_PRODUCT="UAC1 explicit feedback sample"

# Logging
CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_INF=y

CONFIG_UDC_BUF_POOL_SIZE=4096
