common:
  tags:
    - drivers
    - i2c
  depends_on: i2c
tests:
  drivers.i2c.i2c_async:
    platform_allow:
      - sam_e54_xpro
      - pic32cx_sg41_cult
    extra_configs:
      - CONFIG_I2C_MCHP_DMA_DRIVEN=y
  drivers.i2c.i2c_async.gd32_irq:
    platform_allow:
      - gd32f450z_eval
    integration_platforms:
      - gd32f450z_eval
    harness_config:
      fixture: i2c_bus_short
  drivers.i2c.i2c_async.gd32_dma:
    platform_allow:
      - gd32f450z_eval
    integration_platforms:
      - gd32f450z_eval
    harness_config:
      fixture: i2c_bus_short
    extra_configs:
      - CONFIG_I2C_GD32_DMA=y
    extra_dtc_overlay_files:
      - boards/gd32f450z_eval.overlay
      - boards/gd32f450z_eval_dma.overlay
