description: DesignWare OTG USB 2.0 controller

compatible: "snps,dwc2"

include: [base.yaml]

bus: usb

properties:
  reg:
    required: true

  interrupts:
    required: true

  phys:
    type: phandle

  num-in-eps:
    type: int
    required: true
    description: |
      Number of configured IN endpoints including control endpoint.

  num-out-eps:
    type: int
    required: true
    description: |
      Number of configured OUT endpoints including control endpoint.

  ghwcfg1:
    type: int
    required: true
    description: |
      Value of the GHWCFG1 register. It is used to determine available endpoint
      types during driver pre-initialization.

  ghwcfg2:
    type: int
    required: true
    description: |
      Value of the GHWCFG2 register. It is used to determine available endpoint
      types during driver pre-initialization.

  ghwcfg3:
    type: int
    description: |
      Value of the GHWCFG3 register.

      Only a subset of fields is used by the UDC driver (DFIFODEPTH, transfer
      size width, packet count width). Some integrations do not expose GHWCFG*
      registers in the register map; the UDC driver detects this case
      automatically (GHWCFG2 and GHWCFG4 both read as zero) and falls back to
      the values from devicetree.

  ghwcfg4:
    type: int
    required: true
    description: |
      Value of the GHWCFG4 register. It is used to determine available endpoint
      types during driver pre-initialization.
