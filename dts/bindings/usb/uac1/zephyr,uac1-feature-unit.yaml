description: USB Audio Class 1 Feature Unit entity

compatible: "zephyr,uac1-feature-unit"

properties:
  data-source:
    type: phandle
    required: true
    description: Unit or Terminal to which this Feature Unit is connected

  controls:
    type: int
    default: 0
    description: |
      Bitmap of supported controls for this Feature Unit. Bit positions follow
      USB Audio Device Class 1.0 specification, Appendix A.12.2:
      - BIT(0): Mute (D0)
      - BIT(1): Volume (D1)

  volume-min:
    type: int
    description: |
      Minimum volume, in 1/256 dB units (signed 16-bit).

  volume-max:
    type: int
    description: |
      Maximum volume, in 1/256 dB units (signed 16-bit).

  volume-res:
    type: int
    description: |
      Volume resolution (step), in 1/256 dB units (signed 16-bit).
