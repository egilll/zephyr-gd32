description: GigaDevice GD32F4xx microcontroller clock output

compatible: "gd,gd32-ckout"

include:
  - name: base.yaml
  - name: pinctrl-device.yaml

properties:
  output:
    type: int
    required: true
    enum: [0, 1]
    description: CKOUT output index.

  clock-frequency:
    type: int
    required: true
    description: Required output frequency in hertz.

  gd,clock-source:
    type: string
    required: true
    enum: ["pllp"]
    description: Clock source routed to the CKOUT divider.

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
