description: Kinetis UART

compatible: "nxp,kinetis-uart"

include: [uart-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  dmas:
    type: phandle-array
    required: false
    description: |
      Optional RX and TX DMA specifiers used by the asynchronous UART API.

  dma-names:
    required: false
    description: |
      Required when dmas is present. Use "rx", "tx" to match the DMA entries.
