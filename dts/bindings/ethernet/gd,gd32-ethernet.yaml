description: GigaDevice GD32 Ethernet MAC (ENET)

compatible: "gd,gd32-ethernet"

include: [ethernet-controller.yaml, pinctrl-device.yaml, reset-device.yaml, nvmem-consumer.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
    description: |
      Clock names, typically "mac", "tx", "rx" and optionally "ptp".

  resets:
    required: false
    description: |
      Optional MAC bus reset. Supported GD32 ENET implementations expose a
      single "mac" reset domain; TX, RX and PTP are separate clocks, not
      separate reset lines.

  phy-connection-type:
    required: true

  phy-handle:
    required: false
    description: PHY phandle; if omitted, link is handled externally.

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  phy-clock-type:
    type: string
    default: "external"
    enum:
      - "external"
      - "internal"
    description: |
      Selects the PHY reference clock source.
      "external" means the PHY is clocked from its own crystal or oscillator.
      "internal" means the MCU drives CKOUT0 on PA8 as the PHY reference clock.

  zephyr,mac-address-prefix:
    type: uint8-array
    required: false
    description: |
      Optional OUI prefix used when the driver needs to generate a MAC address
      (for example from a device-unique HW ID). This is typically 3 bytes.
