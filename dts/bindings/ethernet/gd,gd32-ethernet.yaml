description: GigaDevice GD32 Ethernet MAC (ENET)

compatible: "gd,gd32-ethernet"

include: [ethernet-controller.yaml, pinctrl-device.yaml, reset-device.yaml, nvmem-consumer.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
    description: |
      Clock names, typically "mac", "tx", "rx" and optionally "ptp".

  phy-connection-type:
    required: true

  phy-handle:
    required: false
    description: PHY phandle; if omitted, link is handled externally.

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  gd,phy-clk-out:
    type: boolean
    required: false
    description: |
      When present, configure CKOUT0 on PA8 to output 50 MHz from PLLP/4
      to feed the external PHY XI pin. Some designs rely on the MCU as the
      PHY clock source. If not present, the driver assumes the PHY has its own
      crystal or clocking source and no CKOUT is configured.

  zephyr,mac-address-prefix:
    type: uint8-array
    required: false
    description: |
      Optional OUI prefix used when the driver needs to generate a MAC address
      (for example from a device-unique HW ID). This is typically 3 bytes.
